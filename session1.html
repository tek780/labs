    return m && f[m[2] - 1] !== undefined ? p.slice(0, i + 1) + encodeURIComponent(m[1] + f[m[2] - 1] + m[3]) : p;
  });
  return base + "?" + parts.join("&");
}

function weekCard(w, showSeason) {
  const hot = showSeason && w.peak;
  return `<div class="week${hot ? " hot" : ""}"><b>${w.L}</b><small>ads</small>${w.ad.toFixed(1)}<div class="bar"><i style="height:${Math.round(w.sales / 1000 * 70)}px"></i></div><small>sales</small>${w.sales}</div>`;
}
function weeksView(mode) {
  const byAd = (x, y) => x.ad - y.ad;

  if (mode === "row") return `<div class="table-top"><p class="rowlabel">One row, from the lowest ad spend on the left to the highest on the right. Ads and sales in kSEK.</p><div class="weeks">${WEEKS.slice().sort(byAd).map((w) => weekCard(w)).join("")}</div></div>`;
  const hot = WEEKS.filter((w) => w.peak).sort(byAd), cold = WEEKS.filter((w) => !w.peak).sort(byAd);
  return `<div class="table-top"><p class="rowlabel hot">The six julbord weeks, lowest ad spend on the left</p><div class="weeks">${hot.map((w) => weekCard(w, true)).join("")}</div>
    <p class="rowlabel" style="margin-top:14px">The ten ordinary weeks, lowest ad spend on the left</p><div class="weeks">${cold.map((w) => weekCard(w, true)).join("")}</div></div>`;
}
function guestCard(g, mark) {

function pilesView(all, showAvg) {
  const bands = all ? [0, 1, 2, 3, 4] : [0, 1, 2, 3];

    const gs = GUESTS.filter((g) => g.band === b && (all || g.reg)).sort((x, y) => y.like - x.like);

    return `<div class="pile"><h3>lives ${BANDS[b]}</h3>${gs.map((g) => guestCard(g, all)).join("")}${foot}</div>`;
  });

const lookMax = () => (S.pick ? S.at : S.at - 1); /* the latest screen that is already behind the group */
