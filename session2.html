<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lunch Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow working column, one step on screen at a time; the cards sit in a ruled "table top" panel. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #18222F; --muted: #5B6878; --line: #D5DBE3;
  --accent: #1F4E79; --accent-ink: #FFFFFF; --hot: #B5402A; --soft: #E6ECF3; --note: #FFF6DA; --note-line: #E3C96B;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11161D; --surface: #1A222C; --ink: #E8EDF3; --muted: #9BA8B8; --line: #334050;
    --accent: #7FB2E0; --accent-ink: #0E1620; --hot: #EE8A72; --soft: #232E3B; --note: #2E2A18; --note-line: #7A6A2A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11161D; --surface: #1A222C; --ink: #E8EDF3; --muted: #9BA8B8; --line: #334050;
  --accent: #7FB2E0; --accent-ink: #0E1620; --hot: #EE8A72; --soft: #232E3B; --note: #2E2A18; --note-line: #7A6A2A;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); }
.where { color: var(--muted); font-size: 15px; }
.track { display: flex; gap: 4px; }
.track span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.track span.done { background: var(--accent); }
.track span.now { background: var(--hot); }
h1 { font-family: var(--display); font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 21px; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 68ch; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.quote { background: var(--note); border: 1px solid var(--note-line); border-radius: 10px; padding: 14px 16px; }
.quote .who { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.envelope { border: 2px dashed var(--hot); border-radius: 10px; padding: 16px; background: var(--surface); }
.envelope .tag { font-family: var(--display); color: var(--hot); font-weight: 700; margin-bottom: 6px; }
.step { font-weight: 700; }
.mins { color: var(--muted); font-weight: 400; font-size: 15px; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
textarea { width: 100%; min-height: 64px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
input[type=text] { width: 100%; max-width: 360px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea:focus-visible, button:focus-visible, input:focus-visible, a.go:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.choice { font: inherit; padding: 12px 16px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: 1 1 220px; text-align: left; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.sure { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sure input[type=range] { flex: 1 1 220px; accent-color: var(--accent); }
.sure output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 4.5ch; }
a.go { display: inline-block; }
.go { font: inherit; font-weight: 700; padding: 13px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; align-self: flex-start; }
.go[disabled] { background: var(--line); color: var(--muted); cursor: not-allowed; }
.go.secondary { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
.hint { color: var(--muted); font-size: 15px; }
.table-top { background: var(--soft); border-radius: 10px; padding: 14px; overflow-x: auto; }
.rowlabel { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.rowlabel.hot { color: var(--hot); }
.weeks { display: flex; gap: 4px; align-items: flex-end; min-width: max-content; }
.week { width: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 2px; text-align: center; font-size: 12.5px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.week b { display: block; font-family: var(--display); font-size: 17px; color: var(--accent); }
.week.hot { border-color: var(--hot); } .week.hot b { color: var(--hot); }
.week .bar { height: 70px; display: flex; align-items: flex-end; justify-content: center; margin: 4px 0; }
.week .bar i { display: block; width: 18px; background: var(--accent); border-radius: 3px 3px 0 0; }
.week.hot .bar i { background: var(--hot); }
.week small { display: block; color: var(--muted); font-size: 11px; }
.piles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); gap: 8px; min-width: max-content; }
.pile { display: flex; flex-direction: column; gap: 6px; }
.pile h3 { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
.guest { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.guest b { font-size: 16px; }
.guest.reg { border-color: var(--hot); border-width: 2px; }
.guest .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 9px; background: var(--hot); color: var(--surface); margin-left: 4px; }
.guest.other { color: var(--muted); }
.pile .foot { font-size: 14px; text-align: center; font-weight: 700; padding-top: 4px; border-top: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.pile .foot span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.loose { display: flex; flex-wrap: wrap; gap: 6px; }
.loose .guest { width: 118px; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { flex: 1 1 200px; background: var(--soft); border-radius: 8px; padding: 12px; }
.stat b { font-family: var(--display); font-size: 30px; display: block; font-variant-numeric: tabular-nums; }
table.recap { width: 100%; border-collapse: collapse; font-size: 16px; }
table.recap th, table.recap td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.recap th { color: var(--muted); font-size: 14px; }
.recap-wrap { overflow-x: auto; }
.milestone { display: flex; align-items: center; gap: 14px; background: var(--note); border: 1px solid var(--note-line); border-radius: 10px; padding: 12px 16px; }
.milestone .stars { color: #E0A100; display: flex; flex: none; }
.research { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 15px; }
.research b:first-child { display: block; font-family: var(--display); font-size: 16px; color: var(--accent); margin-bottom: 2px; }
.lookbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--note); border: 1px solid var(--note-line); border-radius: 10px; padding: 10px 14px; }
.lookbar span { display: flex; flex-wrap: wrap; gap: 8px; }
.lookbar .go { padding: 9px 14px; }
.sendbox { border: 3px solid var(--hot); border-radius: 10px; padding: 18px; background: var(--surface); }
.sendsteps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.sendsteps li { counter-increment: s; position: relative; padding: 10px 12px 10px 48px; border-radius: 8px; background: var(--soft); }
.sendsteps li::before { content: counter(s); position: absolute; left: 12px; top: 9px; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); color: var(--surface); font-weight: 700; text-align: center; line-height: 26px; }
.sendsteps li.now { background: var(--note); outline: 2px solid var(--hot); }
.sendsteps li.now::before { background: var(--hot); }
.sendsteps li.done::before { content: "\2713"; background: var(--accent); color: var(--accent-ink); }
.locked { border-left: 0; background: var(--soft); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.locked b { color: var(--muted); font-size: 13px; display: block; }
details { font-size: 15px; color: var(--muted); }
details button { font: inherit; }
.small { font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { h1 { font-size: 25px; } body { font-size: 16px; } }
@media (prefers-reduced-motion: no-preference) { .week, .guest { transition: border-color .2s; } }

.sq p { margin-bottom: 6px; }
.sq + .sq { margin-top: 16px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { font: inherit; padding: 9px 13px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.opts.seven .opt { min-width: 44px; text-align: center; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.opt.ghost { cursor: default; font-size: 14px; padding: 5px 9px; border-width: 1px; }
.forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.formcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 15px; }
.formcard h3 { margin: 0 0 8px; font-family: var(--display); color: var(--accent); }
.ccgrid { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px; gap: 10px 10px; align-items: center; }
.ccgrid label { margin: 0; font-weight: 700; } .ccgrid label small { display: block; font-weight: 400; color: var(--muted); }
.ccgrid input { width: 100%; text-align: center; } .ccgrid b { text-align: center; font-size: 14px; }
.cmp p { margin-bottom: 4px; }
.barrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 48px 80px; gap: 8px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.track2 { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; height: 18px; overflow: hidden; }
.track2 i { display: block; height: 100%; background: var(--accent); } .track2 i.hotbar { background: var(--hot); }
.barrow small { color: var(--muted); }
.receipts { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; min-width: 520px; }
.rc { font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; padding: 5px 2px 6px; border-radius: 5px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; line-height: 1.15; }
.rc small { display: block; font-size: 10px; color: var(--muted); }
.rc.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; } .rc.on small { color: var(--accent-ink); }
.rc.drawn { border-color: var(--hot); background: var(--note); font-weight: 700; }
.rc[disabled] { cursor: default; opacity: 1; }
.nline { padding: 8px 4px 0; }
.nline .axis { position: relative; height: 34px; border-bottom: 2px solid var(--muted); }
.nline .dot { position: absolute; bottom: 4px; width: 16px; height: 16px; border-radius: 50%; transform: translateX(-50%); }
.nline .dot.lot { background: var(--hot); opacity: .8; } .nline .dot.eye { background: var(--accent); border-radius: 3px; }
.nline .truth { position: absolute; bottom: -2px; width: 3px; height: 34px; background: var(--ink); transform: translateX(-50%); }
.nline .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 2px 6.25% 0 8.33%; font-variant-numeric: tabular-nums; }
.key { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; } .key.eye { background: var(--accent); border-radius: 2px; } .key.lot { background: var(--hot); border-radius: 50%; } .key.tr { background: var(--ink); width: 3px; }
details.slip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--ink); }
.standlist { margin: 4px 0 0; padding-left: 18px; } .do { font-weight: 700; color: var(--hot); }
.tchead { margin: 6px 0 0; font-size: 17px; }
.tcsteps { display: grid; gap: 8px; }
.tcstep { display: grid; grid-template-columns: 30px minmax(0, 1fr) 70px; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line, #d9d4c8); border-radius: 10px; background: var(--surface); }
.tcstep label { margin: 0; font-weight: 400; font-size: 15px; display: grid; gap: 2px; }
.tcnum { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.tcstep input { width: 100%; text-align: center; font-size: 20px; padding: 8px 4px; }
.proj h1 { font-size: 34px; } .proj .rowlabel { font-size: 22px; } .proj .cmp p { font-size: 22px; }
.proj .barrow { grid-template-columns: 70px minmax(0, 1fr) 80px 120px; font-size: 24px; gap: 12px; margin: 6px 0; } .proj .track2 { height: 30px; } .proj .track2 i { height: 100%; }
.proj .projword { font-size: 30px; text-align: center; margin-top: 10px; } .proj .projword b { font-family: var(--display); font-size: 40px; letter-spacing: 1px; }
.tcgrid { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px; gap: 10px; align-items: center; }
.tcgrid label { margin: 0; font-weight: 700; font-size: 15px; } .tcgrid b { text-align: center; font-size: 14px; }
.tcgrid input { width: 100%; text-align: center; font-size: 20px; padding: 8px 4px; }
.bigcode { font-family: var(--display); font-size: 40px; letter-spacing: 2px; font-weight: 700; margin: 0; }
.keytable th, .keytable td { padding: 6px 6px; font-size: 14px; } .keytable td:first-child { width: 22%; }
details.slip summary { font-weight: 700; cursor: pointer; }
</style>
</head>

<script>
const AMOUNTS = [125, 380, 100, 120, 140, 140, 135, 130, 100, 410, 125, 480, 110, 120, 260, 130, 110, 270, 115, 250, 135, 600, 440, 640, 145, 95, 260, 140, 115, 125, 115, 135, 100, 200, 135, 140, 130, 95, 115, 520, 140, 105, 130, 100, 100, 220, 135, 130, 140, 190, 110, 130, 115, 95, 135, 130, 125, 270, 125, 145, 140, 280, 120, 210, 140, 135, 280, 135, 200, 210, 260, 130, 135, 100, 290, 120, 290, 145, 140, 115, 130, 190, 100, 145, 120, 125, 100, 145, 125, 560, 135, 290, 125, 260, 270, 100, 220, 120, 270, 120];
const TRUE_MEAN = AMOUNTS.reduce((a, b) => a + b, 0) / AMOUNTS.length;
const LUNCHES = 25000;
const KEY = "casefiles-s2-v1";
/* Paste the pre-filled Microsoft Forms link here (dummy answers Q1 ... Q28). Empty = offer "Copy our case file" instead. */
const FORM_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=ZXoUKW1T-UO4AuChtc-dv4SG9gvTFfxJkQXWBLPPwb1URTJLTFNKUTI1MlhFQTNGSFdaVVZLNDkxUi4u&rad24921ec80a48fc934be31801ff376d=Q1&r592f42b31b5d46cea13042e9f2ef8808=Q2&r1c16d9e0e0ec497b8b7fe7068b8f6560=Q3&r15aaa74a65de45688ee8fc73308305ef=Q4&r33da5116e2ea46edae0226c2b90c921f=Q5&rdcf97c9e88554398931d07dc7d04c9b0=Q6&r56d11a9bf8174e6bad70e39a279a232e=Q7&rb181761f7cf74a05a7615f36ad1c8420=Q8&r9daab44681744fa2973ddd310388339b=Q9&rc678423f49584b128b3b5482bcc37436=Q10&ra4a20cb7f90a4e2d94739da0fd2f1c6b=Q11&rc7cf8c6183da4206ae7ba9dc567dabaa=Q12&r809b4c962ee24a32bc5406299c91c262=Q13&r93a783cfb20b47c49cd06a157419c739=Q14&r5bbe3f2dcde0450e95b102234379a0f9=Q15&r6e9788b6617f40808c0fbe2d941ca402=Q16&rd6c6ff63cc77447f9c55a69e0e447341=Q17&r650ca7118aaf4aa8833cae060ef38fb0=Q18&rc46f4c25bc454c72a280f97974f1e297=Q19&r8b258130b6fa484a836844352bf5f3ed=Q20&r976cacbc2b85496082d6bf23360f37ff=Q21&rb2232907ef744be7899ec32df542d747=Q22&rb3da839e95b746bea383409fed541d93=Q23&r93ad76f129a646719418fd6714a0ae6a=Q24&r992121a51dca4bc381034187fc90eb0f=Q25&re00e1665593d48a08029a2aed7450185=Q26&re290dd3442674fb89179df36505654c2=Q27&r6da5cf2539e14ce58fbfe050ab6d1666=Q28";
const LAB_WORD = "lunch";
const CLASS_WORD = "count";
const SCREENS = ["intro", "p1a", "p1b", "p1c", "p2a", "p2b", "p2c", "end"];
const GATED = ["p1c", "p2b", "p2c"];
const ENV = { p1c: "envelope 1", p2b: "envelope 2", p2c: "envelope 3" };
/* Teacher key: row = last digit of the group code, column = envelope. All passwords are keywords of quantitative research. */
const WORDS = [["variable", "sample", "mean"], ["hypothesis", "population", "median"], ["validity", "survey", "variance"], ["reliability", "scale", "correlation"], ["causality", "experiment", "regression"],
  ["measurement", "random", "outlier"], ["replication", "bias", "histogram"], ["indicator", "census", "scatter"], ["theory", "interval", "ratio"], ["deduction", "nominal", "ordinal"]];
const norm = (s) => String(s).toLowerCase().replace(/[^a-z]/g, "");
const blank = () => ({ at: 0, a: {}, ui: {}, role: null, group: "", salt: "", sent: null, t: {}, pick: null, tries: {}, look: null, confirmed: false,
  form: Math.random() < 0.5 ? 1 : 2, sv: {}, handed: false, lab: false, eye: [], draws: [], cc: {}, tc: {} });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let preview = location.hash === "#facilitator";
window.addEventListener("hashchange", () => { preview = location.hash === "#facilitator"; render(false); });
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const filled = (k) => (S.a[k] || "").trim().length >= 3;
const follower = () => S.role === "follow";
const password = (screen) => WORDS[Number(String(S.salt).slice(-1)) || 0][GATED.indexOf(screen)];
function gate(screen) { let h = 7; for (const c of S.salt + ":" + screen) h = (h * 31 + c.charCodeAt(0)) % 9000; return String(1000 + h); }
function stamp(id) { if (!S.t[id]) { S.t[id] = Date.now(); } }
const minutes = (from, to) => (S.t[from] && S.t[to] ? Math.max(1, Math.round((S.t[to] - S.t[from]) / 60000)) : "");
const seconds = (from, to) => (S.t[from] && S.t[to] ? Math.max(1, Math.round((S.t[to] - S.t[from]) / 1000)) : "");
function checkCode(list) { let h = 5381; for (const c of list.join("|")) h = (h * 33 + c.charCodeAt(0)) % 2147483647; return h.toString(36).toUpperCase(); }
const clean = (v) => (v == null ? "" : String(v)).replace(/\s+/g, " ").replace(/"/g, "'").trim();
const mean = (list) => (list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0);
const eyeMean = () => Math.round(mean(S.eye.map((i) => AMOUNTS[i])));
const kr = (n) => Math.round(n) + " kr";
const sek = (n) => "SEK " + String(Math.round(Math.abs(n) / 1000) * 1000).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const CC = ["n1", "n2", "a1", "a2", "b1", "b2", "c1", "c2"];
const ccOk = () => validCounts(S.cc);
const share = (q, f) => Math.round(100 * Number(S.cc[q + f]) / Number(S.cc["n" + f]));
const ALPHA = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; /* no 0, 1, I, L, O: they are easy to confuse */
const QS = ["a", "b", "c"];
function validCounts(c) {
  const num = (k) => (/^\d{1,2}$/.test(String(c[k] == null ? "" : c[k]).trim()) ? Number(c[k]) : NaN);
  const n1 = num("n1"), n2 = num("n2");
  if (!(n1 >= 1) || !(n2 >= 1)) return false;
  return QS.every((q) => num(q + "1") <= n1 && num(q + "2") <= n2);
}
function encodeCounts(c) {
  const n1 = BigInt(c.n1), n2 = BigInt(c.n2);
  let v = 0n;
  for (const [k, n] of [["a1", n1], ["b1", n1], ["c1", n1], ["a2", n2], ["b2", n2], ["c2", n2]]) v = v * (n + 1n) + BigInt(c[k]);
  v = v * 10000n + n1 * 100n + n2;

const SCALE_LOW = ["Up to ½ hour", "½ to 1 hour", "1 to 1½ hours", "1½ to 2 hours", "2 to 2½ hours", "More than 2½ hours"];

function tcOut() {

  for (const k of CC) if (val(k) !== "" && !/^\d{1,2}$/.test(val(k))) msgs.push("Use whole numbers only.");
  for (const f of [1, 2]) for (const [q, name] of [["a", "lunch prices"], ["b", "screen time"], ["c", "satisfaction"]])
    if (/^\d+$/.test(val(q + f)) && /^\d+$/.test(val("n" + f)) && Number(val(q + f)) > Number(val("n" + f))) msgs.push(`Form LS-${f}: ${name} (${val(q + f)}) cannot be more than the students with this form (${val("n" + f)}).`);
  for (const f of [1, 2]) if (val("n" + f) === "0") msgs.push(`Form LS-${f}: the number of students cannot be 0.`);
  if (msgs.length) return `<p class="small" style="color:var(--hot);font-weight:700">${[...new Set(msgs)].join("<br>")}</p>`;
  const missing = CC.filter((k) => val(k) === "").length;

    <p><button class="go secondary" data-copycount>Copy the class count</button> <span class="small" id="cccopied" role="status"></span></p></div>${barsFor(c, false)}`;
}

  if (t.hasAttribute("data-next")) { go(); return; }
  if (t.hasAttribute("data-skip")) { S.pick = null; if (S.at < SCREENS.length - 1) S.at++; save(); render(true); return; }
  if (t.hasAttribute("data-confirm")) { S.confirmed = true; save(); render(false); return; }
  if (t.hasAttribute("data-sent")) { S.sent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); save(); setTimeout(() => render(false), 300); return; }
  if (t.hasAttribute("data-copy")) { const text = FIELDS().join("\t"); const done = () => { app.querySelector("#copied").textContent = "Copied. Paste it where your teacher tells you."; }; try { navigator.clipboard.writeText(text).then(done, () => { app.querySelector("#copied").textContent = text; }); } catch (err) { app.querySelector("#copied").textContent = text; } return; }
  if (t.hasAttribute("data-rerole")) { resetLab(); }
});
render(false);

</script>
</body>
</html>
