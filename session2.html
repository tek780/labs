<style>

@media (prefers-color-scheme: dark) {

  const dots = S.draws.map((d) => { const l = (seen[d.mean] = (seen[d.mean] || 0) + 1) - 1; return `<circle cx="${X(d.mean)}" cy="${BASE - R - 1 - l * 13}" r="${R}" fill="var(--accent)"><title>A lottery: ${d.mean / 10} of 10</title></circle>`; }).join("");
  const own = S.eye.length === 10 && !follower() && S.at >= SCREENS.indexOf("p2b");
  const oy = own ? BASE - 8 - (seen[eyeMean()] || 0) * 13 : 0, ox = own ? X(eyeMean()) : 0;
  const diamond = (x, y, s) => `<path d="M${x} ${y - s} L${x + s} ${y} L${x} ${y + s} L${x - s} ${y} Z" fill="var(--note-line)" stroke="var(--ink)" stroke-width="1.5"/>`;
  const ticks = [0, 25, 50, 75, 100].map((v) => `<line x1="${X(v)}" y1="${BASE}" x2="${X(v)}" y2="${BASE + 4}" stroke="var(--muted)"/><text x="${X(v)}" y="${BASE + 17}" text-anchor="middle" fill="var(--muted)">${v}%</text>`).join("");
  return `<figure class="nl"><svg viewBox="0 0 340 172" role="img" aria-label="Share of firms that use AI, from 0 to 100 percent. The ${N_ANS} answers: ${CLAIM} percent.${showTruth ? " All 100 firms: " + TRUE_MEAN + " percent." : ""}${own ? " Your ten calls: " + eyeMean() + " percent." : ""} Your lotteries: ${S.draws.map((d) => d.mean).join(", ")} percent."><g font-size="11.5" fill="var(--ink)">
    <line x1="${X(CLAIM)}" y1="32" x2="${X(CLAIM)}" y2="${BASE}" stroke="var(--hot)" stroke-width="2.5" stroke-dasharray="6 4"/><text x="${X(CLAIM)}" y="27" text-anchor="middle" fill="var(--hot)" font-weight="700">the ${N_ANS} answers: ${CLAIM}%</text>
    ${showTruth ? `<line x1="${X(TRUE_MEAN)}" y1="16" x2="${X(TRUE_MEAN)}" y2="${BASE}" stroke="var(--ink)" stroke-width="2.5"/><text x="${X(TRUE_MEAN)}" y="11" text-anchor="middle" font-weight="700">all 100 firms: ${TRUE_MEAN}%</text>` : ""}
    <line x1="${X(0)}" y1="${BASE}" x2="${X(100)}" y2="${BASE}" stroke="var(--muted)"/>${ticks}<text x="${X(100)}" y="${BASE + 34}" text-anchor="end" fill="var(--muted)">share of firms that use AI</text>

      ${own ? `<span style="white-space:nowrap"><svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align:-3px">${diamond(8, 8, 6.5)}</svg> yellow diamond = your own ten calls</span>` : ""}</figcaption></figure>`;
}
function ownRead() { /* shown after checkpoint 3: reads the group's own numbers, whatever they are */
  if (S.eye.length !== 10 || !S.draws.length) return "";
  const r = eyeAns(), x = eyeMean() / 10, ms = S.draws.map((d) => d.mean / 10), closer = S.draws.filter((d) => Math.abs(d.mean - TRUE_MEAN) < Math.abs(CLAIM - TRUE_MEAN)).length;
  const mix = r <= 1 ? `You phoned ${r === 0 ? "only" : "almost only"} firms that had stayed silent, and <b>${x} of your 10</b> use AI. That is what the silent firms look like: very different from the ${N_ANS} that answered.`
    : r >= 8 ? `You phoned ${r === 10 ? "only" : "mostly"} firms that had already answered, and <b>${x} of your 10</b> use AI. You heard the story of the ${N_ANS} once more.`
    : `You phoned ${r} firms that had answered and ${10 - r} that had stayed silent, and <b>${x} of your 10</b> use AI.`;
  return `<div class="card stack"><h3 style="margin:0">So what? How to read your numbers</h3>
    <p><b>1. Your ten calls.</b> ${mix} On the whole list, about 4 of every 10 firms answered and 6 stayed silent: whom you phone decides what you hear.</p>
    <p><b>2. Your five lotteries.</b> They gave ${ms.join(", ")} of 10. <b>${closer} of the five</b> came closer to ${TRUE_MEAN}% than the ${N_ANS} answers did. A lottery does not ask who answered: every firm has the same chance.</p>
    <p><b>3. Your estimate.</b> Before the calls you said <b>${esc(S.a.est)} of 100</b>. The ${N_ANS} answers said ${CLAIM}; all 100 firms say ${TRUE_MEAN}. A number that is given first tends to pull later guesses towards it.</p></div>`;
}
function lotteryChart() { /* 100 lotteries of ten firms from these 100: how many AI users each one finds (exact chances, rounded) */
  const C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return r; }, K = TRUE_MEAN;
  const P = Array.from({ length: 11 }, (x, k) => (100 * C(K, k) * C(100 - K, 10 - k)) / C(100, 10)), X = (k) => 30 + k * 27, BASE = 150, H = 4.4;
  const N = P.map(Math.floor); P.map((p, k) => [p - Math.floor(p), k]).sort((u, v) => v[0] - u[0] || u[1] - v[1]).slice(0, 100 - N.reduce((s, x) => s + x, 0)).forEach(([r, k]) => N[k]++); /* whole lotteries that add up to 100 */
  const bars = P.map((p, k) => `<rect x="${X(k)}" y="${BASE - Math.max(1, p * H)}" width="22" height="${Math.max(1, p * H)}" fill="${k >= 8 ? "var(--hot)" : k >= 3 && k <= 6 ? "var(--accent)" : "var(--muted)"}"/><text x="${X(k) + 11}" y="${BASE - Math.max(1, p * H) - 4}" text-anchor="middle" font-weight="700">${N[k]}</text><text x="${X(k) + 11}" y="${BASE + 15}" text-anchor="middle">${k}</text>`).join("");
  return `<figure class="nl"><svg viewBox="0 0 340 196" role="img" aria-label="Of 100 lotteries of ten firms, about 82 find 3 to 6 AI users and about 2 find 8 or more."><g font-size="11.5" fill="var(--ink)">${bars}
    <line x1="24" y1="${BASE}" x2="330" y2="${BASE}" stroke="var(--muted)"/><text x="177" y="${BASE + 32}" text-anchor="middle" fill="var(--muted)">AI users among the ten firms of one lottery</text><text x="24" y="12" fill="var(--muted)">number of lotteries, out of 100</text></g></svg>
    <figcaption class="small" style="display:flex;flex-wrap:wrap;gap:4px 18px"><span style="white-space:nowrap"><svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:-2px"><rect width="14" height="14" fill="var(--accent)"/></svg> blue = 3 to 6 users: about 82 lotteries</span><span style="white-space:nowrap"><svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:-2px"><rect width="14" height="14" fill="var(--hot)"/></svg> red = 8 or more: about 2 lotteries</span></figcaption></figure>`;
}
function lesson2() { /* last screen only, after both parts are locked */
  return `<div class="card stack"><h2>What Part 2 shows</h2>
    <p><b>The one idea:</b> a survey describes the ones who answered. Whether they resemble the ones who stayed silent is another question, and the number alone cannot answer it.</p>
    <p><b>1. Who answers is not chance.</b> Firms with something to show were glad to answer: two of three AI users did, and only one of seven non-users. So ${ANS_YES} of ${N_ANS} answers said yes, while ${TRUE_MEAN} of all 100 firms use AI.</p>
    <p><b>2. More of the same does not help.</b> The same survey sent to 1,000 more firms would most likely give about ${CLAIM}% again: more answers, still tilted towards yes in the same way.</p>
    <p><b>3. Ten firms chosen by lottery, and phoned until they answer, beat ${N_ANS} that volunteered.</b> Imagine 100 such lotteries of ten firms. The picture shows how many AI users they find.</p>${lotteryChart()}
    <p>In about <b>82 of the 100 lotteries</b> you find 3, 4, 5 or 6 AI users among the ten, close to the true 4.5. In only about <b>2 of the 100</b> you find 8 or more, which is what the ${N_ANS} answers pointed to.</p>

    <p><b>The two parts together:</b> Part 1 was about <b>how you ask</b>. Part 2 is about <b>who answers</b>. Either one can change a result without anyone noticing.</p></div>`;
}
