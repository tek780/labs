<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow working column, one step on screen at a time; the cards sit in a ruled "table top" panel. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #18222F; --muted: #5B6878; --line: #D5DBE3;
  --accent: #1F4E79; --accent-ink: #FFFFFF; --hot: #B5402A; --soft: #E6ECF3; --note: #FFF6DA; --note-line: #E3C96B;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11161D; --surface: #1A222C; --ink: #E8EDF3; --muted: #9BA8B8; --line: #334050;
    --accent: #7FB2E0; --accent-ink: #0E1620; --hot: #EE8A72; --soft: #232E3B; --note: #2E2A18; --note-line: #7A6A2A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11161D; --surface: #1A222C; --ink: #E8EDF3; --muted: #9BA8B8; --line: #334050;
  --accent: #7FB2E0; --accent-ink: #0E1620; --hot: #EE8A72; --soft: #232E3B; --note: #2E2A18; --note-line: #7A6A2A;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); }
.where { color: var(--muted); font-size: 15px; }
.track { display: flex; gap: 4px; }
.track span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.track span.done { background: var(--accent); }
.track span.now { background: var(--hot); }
h1 { font-family: var(--display); font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 21px; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 68ch; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.quote { background: var(--note); border: 1px solid var(--note-line); border-radius: 10px; padding: 14px 16px; }
.quote .who { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.envelope { border: 2px dashed var(--hot); border-radius: 10px; padding: 16px; background: var(--surface); }
.envelope .tag { font-family: var(--display); color: var(--hot); font-weight: 700; margin-bottom: 6px; }
.step { font-weight: 700; }
.mins { color: var(--muted); font-weight: 400; font-size: 15px; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
textarea { width: 100%; min-height: 64px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
input[type=text] { width: 100%; max-width: 360px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea:focus-visible, button:focus-visible, input:focus-visible, a.go:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.choice { font: inherit; padding: 12px 16px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: 1 1 220px; text-align: left; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.sure { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sure input[type=range] { flex: 1 1 220px; accent-color: var(--accent); }
.sure output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 4.5ch; }
a.go { display: inline-block; }
.go { font: inherit; font-weight: 700; padding: 13px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; align-self: flex-start; }
.go[disabled] { background: var(--line); color: var(--muted); cursor: not-allowed; }
.go.secondary { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
.hint { color: var(--muted); font-size: 15px; }
.table-top { background: var(--soft); border-radius: 10px; padding: 14px; overflow-x: auto; }
.rowlabel { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.rowlabel.hot { color: var(--hot); }
.weeks { display: flex; gap: 4px; align-items: flex-end; min-width: max-content; }
.week { width: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 2px; text-align: center; font-size: 12.5px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.week b { display: block; font-family: var(--display); font-size: 17px; color: var(--accent); }
.week.hot { border-color: var(--hot); } .week.hot b { color: var(--hot); }
.week .bar { height: 70px; display: flex; align-items: flex-end; justify-content: center; margin: 4px 0; }
.week .bar i { display: block; width: 18px; background: var(--accent); border-radius: 3px 3px 0 0; }
.week.hot .bar i { background: var(--hot); }
.week small { display: block; color: var(--muted); font-size: 11px; }
.piles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); gap: 8px; min-width: max-content; }
.pile { display: flex; flex-direction: column; gap: 6px; }
.pile h3 { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
.guest { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.guest b { font-size: 16px; }
.guest.reg { border-color: var(--hot); border-width: 2px; }
.guest .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 9px; background: var(--hot); color: var(--surface); margin-left: 4px; }
.guest.other { color: var(--muted); }
.pile .foot { font-size: 14px; text-align: center; font-weight: 700; padding-top: 4px; border-top: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.pile .foot span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.loose { display: flex; flex-wrap: wrap; gap: 6px; }
.loose .guest { width: 118px; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { flex: 1 1 200px; background: var(--soft); border-radius: 8px; padding: 12px; }
.stat b { font-family: var(--display); font-size: 30px; display: block; font-variant-numeric: tabular-nums; }
table.recap { width: 100%; border-collapse: collapse; font-size: 16px; }
table.recap th, table.recap td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.recap th { color: var(--muted); font-size: 14px; }
.recap-wrap { overflow-x: auto; }
.milestone { display: flex; align-items: center; gap: 14px; background: var(--note); border: 1px solid var(--note-line); border-radius: 10px; padding: 12px 16px; }
.milestone .stars { color: #E0A100; display: flex; flex: none; }
.research { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 15px; }
.research b:first-child { display: block; font-family: var(--display); font-size: 16px; color: var(--accent); margin-bottom: 2px; }
.lookbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--note); border: 1px solid var(--note-line); border-radius: 10px; padding: 10px 14px; }
.lookbar span { display: flex; flex-wrap: wrap; gap: 8px; }
.lookbar .go { padding: 9px 14px; }
.sendbox { border: 3px solid var(--hot); border-radius: 10px; padding: 18px; background: var(--surface); }
.sendsteps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.sendsteps li { counter-increment: s; position: relative; padding: 10px 12px 10px 48px; border-radius: 8px; background: var(--soft); }
.sendsteps li::before { content: counter(s); position: absolute; left: 12px; top: 9px; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); color: var(--surface); font-weight: 700; text-align: center; line-height: 26px; }
.sendsteps li.now { background: var(--note); outline: 2px solid var(--hot); }
.sendsteps li.now::before { background: var(--hot); }
.sendsteps li.done::before { content: "\2713"; background: var(--accent); color: var(--accent-ink); }
.keytable th, .keytable td { padding: 6px 6px; font-size: 14px; } .keytable td:first-child { width: 22%; }
body.wide main { max-width: 1200px; } .proj p { max-width: none; }
.walk { display: grid; gap: 3px; padding: 10px 12px; background: var(--soft); border-radius: 8px; font-size: 15px; color: var(--ink); }
.walk > b { font-family: var(--display); color: var(--accent); }
.tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink); }
.classres td, .classres th { font-size: 15px; }
.proj h1 { font-size: 40px; } .proj .classres td, .proj .classres th { font-size: 26px; padding: 16px 14px; } .proj p { font-size: 24px; }
.proj .ask { font-family: var(--display); font-weight: 700; font-size: 28px; border-left: 8px solid var(--accent); padding: 14px 18px; background: var(--soft); border-radius: 0 8px 8px 0; }
.locked { border-left: 0; background: var(--soft); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.locked b { color: var(--muted); font-size: 13px; display: block; }
details { font-size: 15px; color: var(--muted); }
details button { font: inherit; }
.small { font-size: 14px; color: var(--muted); }
@media (max-width: 480px) { h1 { font-size: 25px; } body { font-size: 16px; } }
@media (prefers-reduced-motion: no-preference) { .week, .guest { transition: border-color .2s; } }
select { width: 100%; font: inherit; padding: .6rem .7rem; border: 1.5px solid #c9ced6; border-radius: 10px; background: #fff; }
.simbars { display: flex; gap: .5rem; align-items: flex-end; height: 170px; padding-top: .5rem; }
.simcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: .9rem; }
.simcol i { display: block; width: 100%; background: #9aa1ab; border-radius: 6px 6px 0 0; }
.simcol.hot i { background: #d9622b; } .simcol b { margin-top: .25rem; } .simcol.hot span { font-weight: 700; color: #b24a1a; }
.gpair { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .7rem; }
.gblock { background: #fff; border: 1.5px solid #c9ced6; border-radius: 10px; padding: .5rem .6rem; } .gblock p { margin: .2rem 0; }
.dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: .3rem 0; } .dots i { aspect-ratio: 1; border-radius: 50%; background: #c3c8d0; } .dots i.yes { background: #1e7b34; }
.starrow { display: flex; justify-content: flex-end; margin: 6px 0 2px; }
.starbadge { display: inline-block; background: #fff7e0; border: 1.5px solid #e2b93b; color: #7a5a00; font-weight: 700; border-radius: 999px; padding: .2rem .7rem; font-size: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.startoast { position: fixed; left: 50%; top: 3.2rem; transform: translateX(-50%); z-index: 50; background: #1f4e79; color: #fff; border-radius: 12px; padding: .7rem 1.1rem; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.25); max-width: 90vw; text-align: center; animation: toastin .35s ease-out, toastout .5s ease-in 8s forwards; font-size: 1.1rem; cursor: pointer; }
.startoast small { display: block; font-weight: 400; opacity: .9; margin-top: .15rem; }
.startoast .st { color: #ffd54a; font-size: 1.3rem; letter-spacing: .1em; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
body.teacher #app { zoom: 1.18; } body.teacher .walk span { font-size: 19px; }
.board { background: #fff; border: 3px solid #8a8f98; border-radius: 10px; padding: 12px 14px; box-shadow: inset 0 0 0 4px #f1f3f6; overflow-x: auto; }
.board table { border-collapse: collapse; width: 100%; font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; font-size: 16px; } .board th { text-align: left; border-bottom: 2px solid var(--ink); padding: 4px 10px; color: var(--ink); } .board td { padding: 5px 10px; border-bottom: 1px dashed #c9ced6; color: #5d6673; }
.board svg { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
.boardcap { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
@keyframes toastout { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .startoast { animation: toastout .01s linear 8.5s forwards; } }
.feedback { background: #fff7e0; border: 1.5px solid #e2b93b; border-radius: 12px; padding: .9rem 1rem; }
.feedback h2 { margin: 0 0 .4rem; font-size: 1.15rem; color: #7a5a00; } .feedback p { margin: .35rem 0; }
.feedback .st { color: #e0a800; font-size: 1.6rem; letter-spacing: .12em; } .feedback .st i { color: #d9d3bd; font-style: normal; }
.fbline { display: flex; gap: .5rem; align-items: baseline; } .fbline b.ok { color: #1e7b34; } .fbline b.no { color: #b24a1a; }
.rank { text-align: center; background: #fff7e0; border: 1.5px solid #e2b93b; border-radius: 14px; padding: 1rem; } .rank .st { color: #e0a800; font-size: 1.8rem; letter-spacing: .1em; } .rank .st i { color: #d9d3bd; font-style: normal; } .rank b { font-size: 1.3rem; display: block; margin-top: .3rem; }
.rank .st { font-size: 1.25rem; letter-spacing: 0; display: block; line-height: 1.3; word-break: break-all; }
header.top { padding-right: 5.6rem; }
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Session 3 lab: The Inbox. One step on screen at a time; an answer is locked before the next step opens. */
const KEY = "inbox-s3-v7";
/* Paste the pre-filled Microsoft Forms link here (dummy answers Q1 ... Q22). Empty = offer "Copy our case file" instead. */
const FORM_URL = "";
const CLASS_WORD = "deal";
const MENU = { "New process": [3, 3, 3, 3, 3, 3, 7, 7, 7, 7], "Old process": [4, 4, 4, 4, 4, 4, 4, 4, 3, 5] };
/* 100 orders: [on time, all] per order type and supplier. Supplier B wins within both types and loses overall. */
const G3 = { own: { Counter: [32, 40], Table: [9, 10] }, party: { Counter: [3, 10], Table: [16, 40] } };
const SVC = { Counter: "Supplier A", Table: "Supplier B" };
const WORDS7 = ["Very dissatisfied", "Dissatisfied", "Somewhat dissatisfied", "Neither", "Somewhat satisfied", "Satisfied", "Very satisfied"];
const SCALE = `<p class="hint"><b>The answer scale:</b> ${WORDS7.map((w, i) => (i + 1) + " = " + w).join(" · ")}</p>`;
const TOOLS = ["Independent t-test", "Paired t-test", "ANOVA", "Chi-square test", "Correlation", "Multiple regression"];
const ASKS = ["Are web-shop customers more satisfied than customers of the physical stores?", "Did the same 30 operators work faster after the training than before?", "Does delivery time differ between our five warehouses?",
  "Are rush orders late more often than standard orders (late: yes or no)?", "Do suppliers with a higher audit score also have fewer defects?", "Which matters most for customer satisfaction: price, delivery time or product quality, each with the others held constant?"];
const KEYS4 = [0, 1, 2, 3, 4, 5];
const SCREENS = ["intro", "t1a", "t1b", "t2a", "t2b", "t3a", "t3b", "t4", "memo", "end"];
const NAMES = { intro: "Start", t1a: "Ticket 1", t1b: "Ticket 1", t2a: "Ticket 2", t2b: "Ticket 2", t3a: "Ticket 3", t3b: "Ticket 3", t4: "Ticket 4", memo: "Memo", end: "Case file" };
let S = { at: 0, a: {}, group: "", t: {}, sim: null, pic: false, word: false, sent: null, fbd: {}, starsSeen: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let preview = location.hash === "#facilitator";
window.addEventListener("hashchange", () => { preview = location.hash === "#facilitator"; render(); });
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clean = (v) => (v == null ? "" : String(v)).replace(/\s+/g, " ").replace(/"/g, "'").trim();
const stamp = (id) => { if (!S.t[id]) S.t[id] = Date.now(); };
const minutes = (a, b) => (S.t[a] && S.t[b] ? Math.max(1, Math.round((S.t[b] - S.t[a]) / 60000)) : "");
function checkCode(list) { let h = 5381; for (const c of list.join("|")) h = (h * 33 + c.charCodeAt(0)) % 2147483647; return h.toString(36).toUpperCase(); }
const app = document.getElementById("app");
let RO = false; /* a step that is already locked is shown read-only */

/* ---------- building blocks ---------- */
const owner = (t, who) => `<div class="quote">${t}<div class="who">${who}</div></div>`;
const QM = "The quality manager", PM = "The product manager", SM = "The purchasing manager";
function advice(key, label, options) {
  const v = S.a[key], sure = S.a[key + "Sure"];
  if (RO) return `<div class="locked"><b>${label}</b>${esc(v || "")}${sure == null ? "" : " (" + sure + "% sure)"}</div>`;
  return `<div class="stack"><div><label>${label}</label><div class="choices" role="group" aria-label="${label}">${options.map((o) => `<button type="button" class="choice" data-choice="${key}" data-val="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join("")}</div></div>
    <div><label for="${key}-sure">How sure are you, from 0 to 100%?</label><div class="sure"><input id="${key}-sure" type="range" min="0" max="100" step="5" value="${sure == null ? 50 : sure}" data-sure="${key}"><output id="${key}-out">${sure == null ? "move the slider" : sure + "%"}</output></div></div></div>`;
}
const adviceDone = (k) => !!S.a[k] && S.a[k + "Sure"] != null;
function pick(key, label, options) {
  if (RO) return `<div class="locked"><b>${label}</b>${esc(S.a[key] || "")}</div>`;
  return `<div><label>${label}</label><div class="choices" role="group" aria-label="${label}">${options.map((o) => `<button type="button" class="choice" data-choice="${key}" data-val="${esc(o)}" aria-pressed="${S.a[key] === o}">${esc(o)}</button>`).join("")}</div></div>`;
}
function num(key, label, min, max, hint) {
  if (RO) return `<div class="locked"><b>${label}</b>${esc(S.a[key] == null ? "" : S.a[key])}</div>`;
  return `<div><label for="${key}">${label}</label><input type="text" inputmode="numeric" id="${key}" data-num="${key}" data-min="${min}" data-max="${max}" value="${esc(S.a[key] == null ? "" : S.a[key])}" style="max-width:8rem">${hint ? `<p class="hint">${hint}</p>` : ""}</div>`;
}
function textQ(key, label, rows) {
  if (RO) return `<div class="locked"><b>${label}</b>${esc(S.a[key] || "")}</div>`;
  return `<div><label for="${key}">${label}</label><textarea id="${key}" data-text="${key}" rows="${rows || 2}" maxlength="240">${esc(S.a[key] || "")}</textarea></div>`;
}
const numOK = (k) => S.a[k] !== undefined && S.a[k] !== "" && !isNaN(Number(S.a[k]));
const textOK = (k) => (S.a[k] || "").trim().length >= 1;

function dotPlot() {
  const W = 560, rowH = 120, x = (v) => 60 + (v - 1) * 72; let h = `<svg viewBox="0 0 ${W} ${rowH * 2 + 40}" role="img" aria-label="Each dot is one customer's rating, for the new process and the old process" style="width:100%;height:auto">`;
  Object.keys(MENU).forEach((name, r) => {
    const base = 100 + r * rowH, cnt = {}; h += `<text x="4" y="${base - 70}" font-size="15" font-weight="700" fill="#1f2a37">${name}</text><line x1="40" x2="${W - 10}" y1="${base}" y2="${base}" stroke="#9aa1ab"/>`;
    MENU[name].forEach((v) => { cnt[v] = (cnt[v] || 0) + 1; h += `<circle cx="${x(v)}" cy="${base - 10 - (cnt[v] - 1) * 11}" r="5" fill="${r ? "#5f6672" : "#1e6fa8"}"/>`; });
  });
  for (let v = 1; v <= 7; v++) h += `<text x="${x(v)}" y="${rowH * 2 + 14}" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">${v}</text>${v === 1 || v === 4 || v === 7 ? `<text x="${v === 1 ? 20 : v === 7 ? W - 4 : x(v)}" y="${rowH * 2 + 32}" font-size="12" text-anchor="${v === 1 ? "start" : v === 7 ? "end" : "middle"}" fill="#5f6672">${WORDS7[v - 1]}</text>` : ""}`;
  return h + `</svg><p class="hint">Each dot is one customer. The dot sits above the rating that customer gave.</p>`;
}
const CSV_MENU = "data:text/csv;charset=utf-8," + encodeURIComponent("process,score\n" + Object.keys(MENU).map((k) => MENU[k].map((v) => k + "," + v).join("\n")).join("\n") + "\n");
function simulate() { /* 1,000 rounds of ten users who each pick a design like a coin flip */
  const tally = Array(11).fill(0);
  for (let n = 0; n < 1000; n++) { let k = 0; for (let i = 0; i < 10; i++) k += Math.random() < 0.5 ? 1 : 0; tally[k]++; }
  return tally;
}
function simView(t) {
  const max = Math.max(...t), hot = t.slice(7).reduce((x, y) => x + y, 0);
  return `<div class="simbars">${t.map((n, k) => `<div class="simcol${k >= 7 ? " hot" : ""}"><span>${n}</span><i style="height:${Math.round((n / max) * 120) + 2}px"></i><b>${k}</b></div>`).join("")}</div>
    <p class="hint">Under each bar: how many of the ten users picked the new design. Above each bar: in how many of the 1,000 rounds that happened. The product manager's result is 7.</p><p>In <b>${hot} of 1,000</b> rounds, luck alone gave the new design <b>7 or more</b> of the ten users: about <b>${Math.round(hot / 10)} times in 100</b>.</p>`;
}
const pct = (y, n) => Math.round((100 * y) / n) + "%";
function dots(y, n) { let h = '<div class="dots">'; for (let i = 0; i < n; i++) h += `<i class="${i < y ? "yes" : "no"}"></i>`; return h + "</div>"; }
function block(label, y, n) { return `<div class="gblock"><p class="rowlabel">${label}</p>${dots(y, n)}<p><b>${y} of ${n}</b> on time = <b>${pct(y, n)}</b></p></div>`; }
function guestsView() {
  const tot = (s) => [G3.own[s][0] + G3.party[s][0], G3.own[s][1] + G3.party[s][1]];
  let h = `<p class="hint">Each dot is one order. Green = delivered on time. Grey = late.</p><p class="rowlabel hot">All 100 orders</p><div class="gpair">${["Counter", "Table"].map((s) => block(SVC[s], ...tot(s))).join("")}</div>`;
  if (!S.split && !RO) return h + `<p>The order system also shows the type of each order: a <b>standard order</b>, or a <b>rush order</b> that is needed within a week.</p><p><button type="button" class="go secondary" data-split>Split the orders by type</button></p>`;
  return h + [["own", "Standard orders (50)"], ["party", "Rush orders (50)"]].map(([k, l]) => `<p class="rowlabel hot">${l}</p><div class="gpair">${["Counter", "Table"].map((s) => block(SVC[s], ...G3[k][s])).join("")}</div>`).join("");
}

/* ---------- drawing and events ---------- */
function render() {
  document.querySelectorAll(".starrow").forEach((n) => n.remove());
  if (preview) { document.body.classList.add("wide"); document.body.classList.add("teacher"); app.innerHTML = `<div class="stack">${teacher()}</div>`; return; }
  document.body.classList.remove("wide");
  const id = SCREENS[S.at], furthest = S.max || 0, locked = !!S.fbd[id]; RO = S.at < furthest || locked; stamp(id);
  const track = `<div class="track" aria-hidden="true">${SCREENS.map((s, i) => `<span class="${i < S.at ? "done" : i === S.at ? "now" : ""}"></span>`).join("")}</div>`;
  let body, foot = "";
  if (id === "end") { body = endView(); foot = `<p><button type="button" class="go secondary" data-back>Look back at our earlier screens (read only)</button></p>`; }
  else { const st = STEP[id]; body = st.html() + (st.mins && !RO ? `<p class="mins">${st.mins}</p>` : "") + fbCard(id);
    foot = S.at < furthest ? `<div class="lookbar"><span>Locked. You are looking back.</span><button type="button" class="go" data-fwd>Forward</button></div>`
      : locked ? `<p><button type="button" class="go" data-cont>Continue</button></p>` : `<p><button type="button" class="go" data-next ${st.ok() ? "" : "disabled"}>${st.go}</button></p>`;
    if (S.at > 0 && !(locked && S.at === furthest)) foot += `<p><button type="button" class="go secondary" data-back>Back</button></p>`; }
  app.innerHTML = `<header class="top"><span class="brand">The Inbox</span><span class="where">${NAMES[id]}${S.group ? " · group " + esc(S.group) : ""}</span></header>${track}<div class="stack">${body}${foot}</div>`;
  if (S.group) { const b = document.createElement("div"); b.className = "starbadge"; b.textContent = "★ " + starTotal() + " / " + STAR_MAX; const row = document.createElement("div"); row.className = "starrow"; row.appendChild(b); const hd = app.querySelector("header"); if (hd) hd.after(row); else app.prepend(row); }
}
function refreshNext() { const b = app.querySelector("[data-next]"); if (b) b.disabled = !STEP[SCREENS[S.at]].ok(); }
app.addEventListener("click", (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.choice) { S.a[t.dataset.choice] = t.dataset.val; save(); render(); }
  else if (t.hasAttribute("data-split")) { S.split = true; save(); render(); }
  else if (t.hasAttribute("data-pic")) { S.pic = true; save(); render(); }
  else if (t.hasAttribute("data-sim")) { S.sim = simulate(); save(); render(); }
  else if (t.hasAttribute("data-next")) { const id = SCREENS[S.at]; if (!STEP[id].ok()) return;
    if (FB[id]) { S.fbd[id] = true; const f = FB[id](); if (f.quick) { S.at++; S.max = Math.max(S.max || 0, S.at); save(); render(); window.scrollTo(0, 0); toast(f.n, f.quick); }
      else { save(); render(); toast(f.n, f.title); const c = app.querySelector(".feedback"); if (c) c.scrollIntoView({ block: "center" }); } }
    else { S.at++; S.max = Math.max(S.max || 0, S.at); save(); render(); window.scrollTo(0, 0); } }
  else if (t.hasAttribute("data-cont")) { S.at++; S.max = Math.max(S.max || 0, S.at); save(); render(); window.scrollTo(0, 0); }
  else if (t.hasAttribute("data-back")) { S.at = Math.max(0, S.at - 1); save(); render(); window.scrollTo(0, 0); }
  else if (t.hasAttribute("data-fwd")) { S.at = Math.min(S.max || 0, S.at + 1); save(); render(); window.scrollTo(0, 0); }
  else if (t.hasAttribute("data-sent")) { S.sent = Date.now(); save(); setTimeout(render, 300); }
  else if (t.hasAttribute("data-copy")) { const txt = notesText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { document.getElementById("copied").textContent = "Copied. Paste it into your notes."; }, () => { document.getElementById("copied").textContent = txt; }); }
});
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.sure) { S.a[t.dataset.sure + "Sure"] = Number(t.value); document.getElementById(t.dataset.sure + "-out").textContent = t.value + "%"; }
  else if (t.hasAttribute("data-group")) { t.value = t.value.replace(/[\t\n"<>]/g, "").slice(0, 40); S.group = t.value.trim(); }
  else if (t.dataset.num) { const v = t.value.replace(/[^\d]/g, ""); t.value = v; const n = Number(v); S.a[t.dataset.num] = v === "" || n < Number(t.dataset.min) || n > Number(t.dataset.max) ? "" : n; if ((t.dataset.num.startsWith("t2s") && !S.sim && ["t2s1", "t2s2", "t2s3"].every(numOK)) || (t.dataset.num.startsWith("t1m") && numOK("t1mnew") && numOK("t1mold") && S.a.t1jasp && !app.querySelector('[data-choice="t1later"]'))) { save(); const pos = t.id; render(); const el = document.getElementById(pos); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; } }
  else if (t.dataset.text) { S.a[t.dataset.text] = t.value; }
  else if (t.dataset.sel) { S.a[t.dataset.sel] = t.value; }
  else if (t.hasAttribute("data-word")) { const ok = t.value.toLowerCase().replace(/[^a-z]/g, "") === CLASS_WORD; if (ok !== S.word) { S.word = ok; save(); if (ok) { render(); return; } } }
  save(); refreshNext();
});
/* Entry lock: the address can be shared before class; the page opens with a code the teacher gives when it is time to start.
   To change the code: put the new word (letters only) through btoa() and paste the result here. */
const ENTRY_CODE = atob("aW5ib3g=");
const LKEY = KEY + "-open";
let OPENED = false; try { OPENED = localStorage.getItem(LKEY) === "1"; } catch (e) {}
const lockOn = () => !OPENED && !preview;
const lockNorm = (s) => String(s).toLowerCase().replace(/[^a-z]/g, "");
const _renderOpen = render;
render = function () {
  if (!lockOn()) {
    _renderOpen.apply(null, arguments);
    if (preview && !app.querySelector(".proj") && !app.querySelector(".entrynote")) { const n = document.createElement("div"); n.className = "locked entrynote"; n.style.marginBottom = "12px"; n.innerHTML = `<b>Entry code for today: <span style="font-size:18px;color:var(--ink)">${ENTRY_CODE}</span></b><br>The page is locked on each device until this word is typed. Say it or write it on the board when it is time to start.`; const c = app.querySelector(".card"); if (c) c.before(n); else app.prepend(n); }
    return;
  }
  document.body.classList.remove("wide");
  app.innerHTML = `<section class="stack"><h1>The Inbox</h1><div class="card stack"><h2>This page opens in class</h2>
    <p>Your teacher gives the entry code when it is time to start.</p>
    <div><label for="entrycode">Entry code</label><input id="entrycode" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="One word"></div>
    <button class="go" data-entry>Open the page</button><p class="small" id="entrymsg" role="status"></p></div></section>`;
};
function tryEntry() {
  const el = app.querySelector("#entrycode"); if (!el) return;
  if (lockNorm(el.value) === lockNorm(ENTRY_CODE)) { OPENED = true; try { localStorage.setItem(LKEY, "1"); } catch (e) {} render(true); try { save(); } catch (e) {} window.scrollTo(0, 0); return; }
  app.querySelector("#entrymsg").textContent = el.value.trim() ? "That is not the entry code. Check the spelling, or ask your teacher." : "Type the entry code first.";
}
app.addEventListener("click", (e) => { if (e.target.closest && e.target.closest("[data-entry]")) tryEntry(); });
app.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "entrycode") tryEntry(); });
render();
